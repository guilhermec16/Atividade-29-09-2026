<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Nilson Produções</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <img src="../img/ChatGPT Image 29 de set. de 2026, 08_37_25.png" class="logo">

        <h1>Nilson Produções</h1>
        <p>Player de Música</p>
    </header>

    <main>

        <div class="player">
            <h2>Tocando agora</h2>
            <h3 id="tituloAtual">Selecione uma música</h3>
            <p id="artistaAtual">Nenhum artista</p>

            <audio id="audioPlayer" controls></audio>
        </div>

        <h2>Lista de Músicas</h2>

        <div class="musica" data-audio="musicas/musica1.mp3">
            <h3>Música 1</h3>
            <p>Artista 1</p>
        </div>

        <div class="musica" data-audio="musicas/musica2.mp3">
            <h3>Música 2</h3>
            <p>Artista 2</p>
        </div>

        <div class="musica" data-audio="musicas/musica3.mp3">
            <h3>Música 3</h3>
            <p>Artista 3</p>
        </div>

    </main>

</body>

</html>
